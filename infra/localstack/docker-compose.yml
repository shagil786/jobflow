services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${JOBFLOW_CONTEXT_DB_NAME:-jobflow_context}
      POSTGRES_USER: ${JOBFLOW_CONTEXT_DB_USERNAME:-jobflow}
      POSTGRES_PASSWORD: ${JOBFLOW_CONTEXT_DB_PASSWORD:-jobflow}
    volumes:
      - "${JOBFLOW_POSTGRES_VOLUME_DIR:-./.postgres}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOBFLOW_CONTEXT_DB_USERNAME:-jobflow} -d ${JOBFLOW_CONTEXT_DB_NAME:-jobflow_context}"]
      interval: 5s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:3.8
    container_name: jobflow-localstack
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
      SERVICES: sqs
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: ${LOCALSTACK_PERSISTENCE:-1}
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
